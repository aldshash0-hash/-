<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العكريشي</title>
    <style>
        :root {
            --bg: #0f1220;
            --card: #181c30;
            --primary: #3a9c40;
            --text: #eceefa;
            --accent: #d4af37;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #232946; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 1em; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .switch-btn { background: transparent; color: var(--accent); border: none; text-decoration: underline; cursor: pointer; display: block; margin: 15px auto; }
        .hidden { display: none; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; border: 1px solid var(--primary); color: #fff; padding: 15px; border-radius: 8px; font-weight: bold; z-index: 1000; }
        .admin-badge { background: #5a2a2a; border: 1px solid var(--accent); padding: 10px; border-radius: 6px; margin-top: 10px; color: var(--accent); text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- بطاقة تسجيل الدخول -->
    <div id="login_card" class="card">
        <h2>تسجيل الدخول - منصة العكريشي</h2>
        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="login_email" placeholder="أدخل بريدك المسجل">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="login_password" placeholder="أدخل كلمة المرور">
        </div>
        <button onclick="PlatformAuth.login()">دخول</button>
        <button class="switch-btn" onclick="UI.showRegister()">ليس لديك حساب؟ أنشئ حساباً الآن</button>
    </div>

    <!-- بطاقة إنشاء الحساب -->
    <div id="register_card" class="card hidden">
        <h2>إنشاء حساب جديد</h2>
        <div class="input-group">
            <label>الاسم الكامل</label>
            <input type="text" id="reg_name" placeholder="اسمك الثلاثي">
        </div>
        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="reg_email" placeholder="سيستخدم لتسجيل الدخول">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="reg_password" placeholder="أنشئ كلمة مرور قوية">
        </div>
        <div class="input-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="reg_phone" placeholder="01xxxxxxxxxx">
        </div>
        <button onclick="PlatformAuth.register()">تسجيل الحساب</button>
        <button class="switch-btn" onclick="UI.showLogin()">تسجيل الدخول?</button>
    </div>

    <!-- لوحة تحكم الطالب / المحتوى -->
    <div id="user_dashboard" class="card hidden">
        <h2>مرحباً بك في منصة العكريشي</h2>
        <p id="user_welcome_text"></p>
        <div style="margin-top: 20px; padding: 15px; background: #232946; border-radius: 8px;">
            <h3>دوراتك المفعلة:</h3>
            <p>• النحو العربي للثانوية العامة</p>
            <p>• البلاغة والنقد</p>
        </div>
        <button style="background: #a94442;" onclick="PlatformAuth.logout()">تسجيل الخروج</button>
    </div>

    <!-- لوحة تحكم الأدمن -->
    <div id="admin_dashboard" class="card hidden" style="border: 2px solid var(--accent);">
        <h2 style="color: var(--accent);">لوحة تحكم المدير (Admi</h2>
        <div class="admin-badge">
            <strong>رقم تسجيل الأدمن المعتمد:</strong><br>
            <span style="font-size: 1.4em; font-family: monospace;">ADM-9999-AK</span>
        </div>
        <p style="margin-top: 15px;">صلاحيات كاملة للتحكم في المحتوى وإدارة المستخدمين.</p>
        <div id="users_list_container" style="margin-top: 15px; background: #0f1220; padding: 10px; border-radius: 6px;">
            <h4>المستخدمون المسجلون:</h4>
            <div id="users_list" style="font-size: 0.9em; max-height: 150px; overflow-y: auto;"></div>
        </div>
        <button style="background: var(--accent); color: black;" onclick="PlatformAuth.logout()">تسجيل الخروج</button>
    </div>
</div>

<div id="toast" class="hidden"></div>

<script>
    // بيانات الأدمن الثابتة
    const ADMIN_CREDENTIALS = {
        email: "admin@alakrishi.com",
        password: "admin",
        adminId: "ADM-9999-AK"
    };

    const UI = {
        showLogin: function() {
            document.getElementById('register_card').classList.add('hidden');
            document.getElementById('admin_dashboard').classList.add('hidden');
            document.getElementById('user_dashboard').classList.add('hidden');
            document.getElementById('login_card').classList.remove('hidden');
        },
        showRegister: function() {
            document.getElementById('login_card').classList.add('hidden');
            document.getElementById('register_card').classList.remove('hidden');
        },
        showToast: function(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        },
        renderAdminUsers: function() {
            const users = JSON.parse(localStorage.getItem('alakrishi_users') || '[]');
            const container = document.getElementById('users_list');
            container.innerHTML = users.map(u => `<div>👤 ${u.name} - 📱 ${u.phone}</div>`).join('');
        }
    };

    const PlatformAuth = {
        init: function() {
            // تهيئة حساب الأدمن افتراضياً
            let users = JSON.parse(localStorage.getItem('alakrishi_users') || '[]');
            if (!users.find(u => u.email === ADMIN_CREDENTIALS.email)) {
                users.push({
                    name: "الدكتور مصطفى العكريشي (Admin)",
                    email: ADMIN_CREDENTIALS.email,
                    password: ADMIN_CREDENTIALS.password,
                    role: 'admin',
                    phone: "01100000000"
                });
                localStorage.setItem('alakrishi_users', JSON.stringify(users));
            }

            const currentUser = localStorage.getItem('alakrishi_current_user');
            if (currentUser) {
                const userObj = JSON.parse(currentUser);
                this.loadDashboard(userObj);
            }
        },
        register: function() {
            const name = document.getElementById('reg_name').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;
            const phone = document.getElementById('reg_phone').value;

            if(!name || !email || !password || !phone) {
                UI.showToast("يرجى تعبئة جميع بيانات التسجيل");
                return;
            }

            let users = JSON.parse(localStorage.getItem('alakrishi_users') || '[]');
            if(users.find(u => u.email === email)) {
                UI.showToast("هذا البريد مسجل مسبقاً، يرجى تسجيل الدخول");
                return;
            }

            const newUser = { name, email, password, phone, role: 'student' };
            users.push(newUser);
            localStorage.setItem('alakrishi_users', JSON.stringify(users));
            UI.showToast("تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن");
            UI.showLogin();
        },
        login: function() {
            const email = document.getElementById('login_email').value;
            const password = document.getElementById('login_password').value;

            if(!email || !password) {
                UI.showToast("يرجى إدخال البريد وكلمة المرور");
                return;
            }

            let users = JSON.parse(localStorage.getItem('alakrishi_users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if(user) {
                localStorage.setItem('alakrishi_current_user', JSON.stringify(user));
                this.loadDashboard(user);
            } else {
                UI.showToast("بيانات الدخول غير صحيحة أو الحساب غير موجود");
            }
        },
        loadDashboard: function(user) {
            document.getElementById('login_card').classList.add('hidden');
            document.getElementById('register_card').classList.add('hidden');

            if(user.role === 'admin') {
                document.getElementById('admin_dashboard').classList.remove('hidden');
                UI.renderAdminUsers();
            } else {
                document.getElementById('user_dashboard').classList.remove('hidden');
                document.getElementById('user_welcome_text').textContent = `أهلاً بك، ${user.name}`;
            }
        },
        logout: function() {
            localStorage.removeItem('alakrishi_current_user');
            UI.showToast("تم تسجيل الخروج");
            UI.showLogin();
        }
    };

    document.addEventListener('DOMContentLoaded', () => PlatformAuth.init());
</script>

</body>
</html>
