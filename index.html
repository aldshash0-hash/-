<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العكريشي</title>
<meta name="description" content="دروس اللغة العربية لكل مرحلة دراسية">
<meta property="og:title" content="العكريشي"><meta property="og:site_name" content="العكريشي">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--card:#fff;--text:#16192b;--muted:#586079;--pri:#2b3a8c;--onpri:#fff;--acc:#e8590c;--line:#dbe0ee;--ok:#18794e;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--text:#eceefa;--muted:#a3a9c4;--pri:#8e9bff;--onpri:#10142c;--acc:#ff8a4c;--line:#2a2f4a;--ok:#5ad19a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--text:#eceefa;--muted:#a3a9c4;--pri:#8e9bff;--onpri:#10142c;--acc:#ff8a4c;--line:#2a2f4a;--ok:#5ad19a;--bad:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,.logo{font-family:"Reem Kufi","Cairo",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:960px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 14px}.logo{font-size:1.5rem;color:var(--pri);margin-inline-end:auto}
main{max-width:960px;margin:auto;padding:16px;min-height:70vh}
.btn,.chip{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.p,.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.btn.a{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{background:var(--pri);color:var(--onpri);border-radius:14px;padding:22px;margin-bottom:14px}.hero h1{margin:0;font-size:1.7rem}.hero p{margin:4px 0 0;opacity:.92}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}.grid .card{margin:0}.card h3{margin:0 0 4px}
.muted{color:var(--muted);font-size:.9rem}.price{font-weight:700;color:var(--acc);font-size:1.1rem}.ok{color:var(--ok);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.un{color:var(--pri);margin:18px 0 6px}
.ls{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.ls:first-child{border-top:0}.ls.lk{cursor:default;color:var(--muted)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;flex:none}.dot.d{background:var(--ok);border-color:var(--ok);color:#fff}
.tag{font-size:.75rem;background:var(--acc);color:#fff;border-radius:6px;padding:0 8px}
.vid{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:12px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}input[type=radio]{width:auto;margin:0 0 0 8px}
label.o{display:block;padding:4px 0}.q{border-top:1px solid var(--line);padding:10px 0}.q.w b{color:var(--bad)}
.code{font-size:1.6rem;font-weight:700;letter-spacing:2px;color:var(--acc);direction:ltr;text-align:center;background:var(--bg);border-radius:10px;padding:6px;margin:6px 0}
.pay ol{padding-inline-start:20px}.pay li{margin-bottom:10px}
#toast{position:fixed;bottom:20px;inset-inline:16px;margin:auto;max-width:420px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;text-align:center;z-index:30}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}#modal .card{max-width:520px;margin:0}
footer{text-align:center;color:var(--muted);padding:20px;font-size:.85rem}footer a{color:var(--muted);margin:0 8px;cursor:pointer;text-decoration:underline}[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="bar"><div class="logo" id="logo">📚 العكريشي</div><button class="btn" data-a="r">نتائجي</button></div></header>
<main id="app"></main>
<footer><a data-leg="terms">شروط الاستخدام</a><a data-leg="privacy">الخصوصية</a><a data-leg="refund">الاسترجاع</a><a id="wa" target="_blank" rel="noopener">تواصل واتساب</a><a href="admin.html">دخول المدير</a></footer>
<div id="modal" hidden></div><div id="toast" hidden></div>
<script src="data.js"></script>
<script>
const D=window.AK||{settings:{},courses:[]},ST=D.settings||{},C=D.courses||[];
const GR=["الأول الإعدادي","الثاني الإعدادي","الثالث الإعدادي","الأول الثانوي","الثاني الثانوي","الثالث الثانوي"];
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let codes=LS.g("ak_codes",{}),sc=LS.g("ak_scores",{}),opened={},grade="الكل";
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,5000)}
/*U*/
const dec=new TextDecoder(),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const kdf=async(sec,salt)=>crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},await crypto.subtle.importKey("raw",new TextEncoder().encode(sec),"PBKDF2",false,["deriveKey"]),{name:"AES-GCM",length:256},false,["decrypt"]);
const dc=async(k,o)=>new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.iv)},k,ub(o.ct)));
async function unlock(c,code){code=String(code).toUpperCase().replace(/[^A-Z0-9]/g,"");const id=code.slice(0,4),sec=code.slice(4),w=(c.wraps||[]).find(x=>x.id==id);if(!w||sec.length<8)return false;
try{const raw=await dc(await kdf(sec,ub(w.salt)),w);const ck=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
opened[c.id]=c.locked?JSON.parse(dec.decode(await dc(ck,c.locked))):[];codes[c.id]=code;LS.s("ak_codes",codes);return true}catch(e){return false}}
/*V*/
const all=c=>[...(c.free||[]),...(opened[c.id]||[])].sort((a,b)=>a.n-b.n);
function home(){const L=C.filter(c=>grade=="الكل"||c.grade==grade);
app.innerHTML=`<div class="hero"><h1>${esc(ST.name||"العكريشي")}</h1><p>${esc(ST.tag||"")}</p></div><div class="chips">${["الكل",...GR].map(g=>`<button class="chip ${g==grade?"on":""}" data-a="g|${g}">${g}</button>`).join("")}</div>
${L.length?`<div class="grid">${L.map(c=>`<div class="card"><div class="muted">${esc(c.grade)}</div><h3>${esc(c.title)}</h3><div class="muted">${esc(c.desc)}</div><div class="row">${opened[c.id]?`<span class="ok">🔓 مفعّل</span>`:`<span class="price">${c.price} جنيه</span>`}<button class="btn p" data-a="c|${c.id}">فتح</button></div></div>`).join("")}</div>`:`<div class="card muted">لا توجد كورسات بعد.</div>`}`}
function course(id){const c=C.find(x=>x.id==id),ok=!!opened[id];
const items=ok?all(c):[...(c.free||[]),...(c.outline||[]).map(o=>({id:o.id,title:o.t,unit:o.u,n:o.n,lock:1}))].sort((a,b)=>a.n-b.n);
const wa=`https://wa.me/${ST.wa||""}?text=${encodeURIComponent(`مرحبًا، حوّلت ${c.price} جنيه للاشتراك في كورس: ${c.title}`)}`,U=[...new Set(items.map(l=>l.unit||"الدروس"))];
app.innerHTML=`<button class="btn" data-a="h">رجوع</button><div class="card" style="margin-top:10px"><div class="muted">${esc(c.grade)}</div><h2 style="margin:0">${esc(c.title)}</h2><p>${esc(c.desc)}</p>
${ok?`<span class="ok">🔓 الكورس مفعّل</span>`:`<div class="pay"><span class="price">${c.price} جنيه</span><ol><li>حوّل المبلغ إلى الرقم:<div class="code">${esc(ST.pay)}</div><button class="btn" data-a="cp">نسخ الرقم</button></li><li>أرسل صورة التحويل على واتساب: <a class="btn a" href="${wa}" target="_blank" rel="noopener">إرسال على واتساب</a></li><li>سيصلك كود التفعيل، اكتبه هنا:</li></ol><input id="cd" dir="ltr" placeholder="XXXX-XXXXXXXX" autocomplete="off"><div class="row"><button class="btn p" data-a="act|${id}">تفعيل</button></div></div>`}</div>
${items.length?U.map(u=>`<h3 class="un">${esc(u)}</h3><div class="card">${items.filter(l=>(l.unit||"الدروس")==u).map(l=>l.lock?`<div class="ls lk"><span class="dot">🔒</span><span>${esc(l.title)}</span></div>`:`<div class="ls" data-a="l|${id}|${l.id}"><span class="dot ${sc[l.id]?"d":""}">${sc[l.id]?"✓":""}</span><span>${esc(l.title)}</span>${!ok?`<span class="tag">مجاني</span>`:""}${sc[l.id]?`<span class="muted" style="margin-inline-start:auto">${sc[l.id].score}/${sc[l.id].total}</span>`:""}</div>`).join("")}</div>`).join(""):`<div class="card muted">لا توجد دروس بعد.</div>`}`}
function lesson(cid,lid){const c=C.find(x=>x.id==cid),l=all(c).find(x=>x.id==lid),m=(l.video||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
app.innerHTML=`<button class="btn" data-a="c|${cid}">رجوع</button><div class="card" style="margin-top:10px"><h2 style="margin:0 0 10px">${esc(l.title)}</h2>${m?`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0" allowfullscreen loading="lazy" title="${esc(l.title)}"></iframe></div>`:l.video?`<a class="btn p" href="${esc(l.video)}" target="_blank" rel="noopener">شاهد الفيديو</a>`:""}
${l.pdf?`<div class="row"><a class="btn" href="${esc(l.pdf)}" target="_blank" rel="noopener">📄 ملزمة الدرس</a></div>`:""}</div>
${(l.quiz||[]).length?`<div class="card"><h3>اختبار الدرس</h3>${l.quiz.map((x,i)=>`<div class="q" id="q${i}"><b>${i+1}. ${esc(x.q)}</b>${x.o.map((o,j)=>`<label class="o"><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join("")}</div>`).join("")}<div class="row"><button class="btn p" data-a="sub|${cid}|${lid}">تسليم الإجابات</button><b id="rs" class="ok"></b></div></div>`:""}`}
function submit(cid,lid){const l=all(C.find(x=>x.id==cid)).find(x=>x.id==lid),a=l.quiz.map((_,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1});
if(a.includes(-1))return toast("أجب عن كل الأسئلة أولًا");const w=a.map((v,i)=>v==l.quiz[i].a?-1:i).filter(i=>i>=0),s=a.length-w.length;
sc[lid]={score:s,total:a.length,at:Date.now(),title:l.title};LS.s("ak_scores",sc);l.quiz.forEach((_,i)=>$("#q"+i).classList.toggle("w",w.includes(i)));$("#rs").textContent=`نتيجتك ${s} من ${a.length}${w.length?" — الأسئلة الخاطئة بالأحمر":" 🌟"}`}
function results(){const R=Object.values(sc).sort((a,b)=>b.at-a.at);app.innerHTML=`<h2>نتائجي</h2>${R.length?`<div class="card">${R.map(r=>`<div class="ls" style="cursor:default"><span>${esc(r.title)}</span><b style="margin-inline-start:auto">${r.score}/${r.total}</b></div>`).join("")}</div><p class="muted">النتائج محفوظة على هذا الجهاز فقط.</p>`:`<div class="card muted">لم تحل أي اختبار بعد.</div>`}`}
async function activate(id){const c=C.find(x=>x.id==id);toast("جارٍ التحقق…");if(await unlock(c,$("#cd").value)){toast("تم تفعيل الكورس ✓");course(id)}else toast("الكود غير صحيح")}
async function copyNum(){try{await navigator.clipboard.writeText(ST.pay);toast("تم نسخ الرقم")}catch(e){toast("انسخ الرقم يدويًا: "+ST.pay)}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const[a,x,y]=b.dataset.a.split("|");if(!["sub","cp","act"].includes(a))scrollTo(0,0);({g:()=>{grade=x;home()},c:()=>course(x),l:()=>lesson(x,y),h:home,r:results,cp:copyNum,act:()=>activate(x),sub:()=>{submit(x,y)}})[a]()});
document.querySelectorAll("[data-leg]").forEach(a=>a.onclick=()=>{const m=$("#modal");m.innerHTML=`<div class="card"><h3>${a.textContent}</h3><p>${esc((ST.legal||{})[a.dataset.leg]||"")}</p><button class="btn p" id="mc">إغلاق</button></div>`;m.hidden=false;$("#mc").onclick=()=>m.hidden=true});
$("#wa").href="https://wa.me/"+(ST.wa||"");$("#logo").textContent="📚 "+(ST.name||"العكريشي");
(async()=>{home();for(const c of C)if(codes[c.id])await unlock(c,codes[c.id]);home()})();
</script>
</body>
</html>
