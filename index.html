<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العكريشي</title>
<meta name="description" content="دروس اللغة العربية لكل مرحلة دراسية">
<meta property="og:title" content="العكريشي"><meta property="og:site_name" content="العكريشي">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--card:#fff;--text:#16192b;--muted:#586079;--pri:#2b3a8c;--onpri:#fff;--acc:#e8590c;--line:#dbe0ee;--ok:#18794e;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--text:#eceefa;--muted:#a3a9c4;--pri:#8e9bff;--onpri:#10142c;--acc:#ff8a4c;--line:#2a2f4a;--ok:#5ad19a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--text:#eceefa;--muted:#a3a9c4;--pri:#8e9bff;--onpri:#10142c;--acc:#ff8a4c;--line:#2a2f4a;--ok:#5ad19a;--bad:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,.logo{font-family:"Reem Kufi","Cairo",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:960px;margin:auto;display:flex;align-items:center;gap:8px;padding:8px 14px}.logo{font-size:1.5rem;color:var(--pri);margin-inline-end:auto}
main{max-width:960px;margin:auto;padding:16px;min-height:70vh}
.btn,.chip{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.p,.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.btn.a{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{background:var(--pri);color:var(--onpri);border-radius:14px;padding:22px;margin-bottom:14px}.hero h1{margin:0;font-size:1.7rem}.hero p{margin:4px 0 0;opacity:.92}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}.grid .card{margin:0}.card h3{margin:0 0 4px}
.muted{color:var(--muted);font-size:.9rem}.price{font-weight:700;color:var(--acc);font-size:1.1rem}.ok{color:var(--ok);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.un{color:var(--pri);margin:18px 0 6px}
.ls{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.ls:first-child{border-top:0}.ls.lk{cursor:default;color:var(--muted)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;flex:none}.dot.d{background:var(--ok);border-color:var(--ok);color:#fff}
.tag{font-size:.75rem;background:var(--acc);color:#fff;border-radius:6px;padding:0 8px}
.vid{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:12px}.vid video{position:absolute;inset:0;width:100%;height:100%}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}input[type=radio]{width:auto;margin:0 0 0 8px}
label.o{display:block;padding:4px 0}.q{border-top:1px solid var(--line);padding:10px 0}.q.w b{color:var(--bad)}
.code{font-size:1.6rem;font-weight:700;letter-spacing:2px;color:var(--acc);direction:ltr;text-align:center;background:var(--bg);border-radius:10px;padding:6px;margin:6px 0}
.pay ol{padding-inline-start:20px}.pay li{margin-bottom:10px}
#toast{position:fixed;bottom:20px;inset-inline:16px;margin:auto;max-width:420px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;text-align:center;z-index:30}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}#modal .card{max-width:520px;margin:0}
footer{text-align:center;color:var(--muted);padding:20px;font-size:.85rem}footer a{color:var(--muted);margin:0 8px;cursor:pointer;text-decoration:underline}[hidden]{display:none!important}

select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}input[type=checkbox]{width:auto;margin:0 0 0 8px}input[type=file]{padding:6px}
label{font-size:.9rem;color:var(--muted)}.auth{max-width:420px;margin:30px auto}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.btn.d{color:var(--bad);border-color:var(--bad)}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--acc);width:0}
.warn{background:#fff3cd;color:#664d03;border-radius:10px;padding:10px 14px;margin-bottom:12px}.cd{direction:ltr;font-weight:700;letter-spacing:1px;color:var(--acc)}
</style>
</head>
<body>
<header><div class="bar"><div class="logo" id="logo">📚 العكريشي</div><span id="nav"></span></div></header>
<main id="app"><div class="card muted">جارٍ التحميل…</div></main>
<footer><a data-leg="terms">شروط الاستخدام</a><a data-leg="privacy">الخصوصية</a><a data-leg="refund">الاسترجاع</a><a id="wa" target="_blank" rel="noopener">تواصل واتساب</a><a id="adl">دخول المدير</a></footer>
<div id="modal" hidden></div><div id="toast" hidden></div>
<script>
const GR=["الأول الإعدادي","الثاني الإعدادي","الثالث الإعدادي","الأول الثانوي","الثاني الثانوي","الثالث الثانوي"];
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const dig=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>AL[x%32]).join("");
const hex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,"0")).join("");
let S={settings:{},courses:[],admin:false},W=null,grade="الكل",sc=LS.g("ak_scores",{}),tab="c",sel="",ed=null;
const toast=t=>{const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,6000)};
async function api(a,body,q){let r,j;try{r=await fetch("api.php?a="+a+(q||""),body===undefined?{cache:"no-store"}:{method:"POST",headers:{"Content-Type":"application/json","X-Req":"1"},body:JSON.stringify(body)});j=await r.json()}catch(e){throw new Error("تعذّر الاتصال بالخادم. تأكد أن الاستضافة تدعم PHP وأن ملف api.php مرفوع")}
if(!r.ok)throw new Error(j.e||"خطأ");return j}
async function load(){S=await api("state");const t=S.settings||{};$("#logo").textContent="📚 "+(t.name||"العكريشي");$("#wa").href="https://wa.me/"+(t.wa||"");document.title=t.name||"العكريشي";nav()}
function nav(){$("#nav").innerHTML=`<button class="btn" data-a="r">نتائجي</button>${S.admin?`<button class="btn p" data-a="adm">لوحة المدير</button><button class="btn" data-a="lo">خروج</button>`:""}`}
/* ===== الطالب ===== */
function home(){const L=S.courses.filter(c=>grade=="الكل"||c.grade==grade),t=S.settings;
app.innerHTML=`<div class="hero"><h1>${esc(t.name||"العكريشي")}</h1><p>${esc(t.tag||"")}</p></div><div class="chips">${["الكل",...GR].map(g=>`<button class="chip ${g==grade?"on":""}" data-a="g|${g}">${g}</button>`).join("")}</div>
${L.length?`<div class="grid">${L.map(c=>`<div class="card"><div class="muted">${esc(c.grade)}</div><h3>${esc(c.title)}</h3><div class="muted">${esc(c.desc)}</div><div class="row">${c.unlocked?`<span class="ok">🔓 مفعّل</span>`:`<span class="price">${c.price} جنيه</span>`}<button class="btn p" data-a="c|${c.id}">فتح</button></div></div>`).join("")}</div>`:`<div class="card muted">لا توجد كورسات بعد.</div>`}`}
function course(id){const c=S.courses.find(x=>x.id==id),t=S.settings,ok=c.unlocked,U=[...new Set(c.lessons.map(l=>l.unit||"الدروس"))];
const wa=`https://wa.me/${t.wa||""}?text=${encodeURIComponent(`مرحبًا، حوّلت ${c.price} جنيه للاشتراك في كورس: ${c.title}`)}`;
app.innerHTML=`<button class="btn" data-a="h">رجوع</button><div class="card" style="margin-top:10px"><div class="muted">${esc(c.grade)}</div><h2 style="margin:0">${esc(c.title)}</h2><p>${esc(c.desc)}</p>
${ok?`<span class="ok">🔓 الكورس مفعّل</span>`:`<div class="pay"><span class="price">${c.price} جنيه</span><ol><li>حوّل المبلغ إلى الرقم:<div class="code">${esc(t.pay)}</div><button class="btn" data-a="cp">نسخ الرقم</button></li><li>أرسل صورة التحويل على واتساب: <a class="btn a" href="${wa}" target="_blank" rel="noopener">إرسال على واتساب</a></li><li>سيصلك كود التفعيل، اكتبه هنا:</li></ol><input id="cd" dir="ltr" placeholder="XXXXX-XXXXX" autocomplete="off"><div class="row"><button class="btn p" data-a="act|${id}">تفعيل</button></div></div>`}</div>
${c.lessons.length?U.map(u=>`<h3 class="un">${esc(u)}</h3><div class="card">${c.lessons.filter(l=>(l.unit||"الدروس")==u).map(l=>l.open?`<div class="ls" data-a="l|${id}|${l.id}"><span class="dot ${sc[l.id]?"d":""}">${sc[l.id]?"✓":""}</span><span>${esc(l.title)}</span>${l.free&&!ok?`<span class="tag">مجاني</span>`:""}${sc[l.id]?`<span class="muted" style="margin-inline-start:auto">${sc[l.id].score}/${sc[l.id].total}</span>`:""}</div>`:`<div class="ls lk"><span class="dot">🔒</span><span>${esc(l.title)}</span></div>`).join("")}</div>`).join(""):`<div class="card muted">لا توجد دروس بعد.</div>`}`}
function lesson(cid,lid){const c=S.courses.find(x=>x.id==cid),l=c.lessons.find(x=>x.id==lid),m=(l.video||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/),f=k=>`api.php?a=file&c=${cid}&l=${lid}&k=${k}`,http=u=>/^https?:\/\//i.test(u||"");
app.innerHTML=`<button class="btn" data-a="c|${cid}">رجوع</button><div class="card" style="margin-top:10px"><h2 style="margin:0 0 10px">${esc(l.title)}</h2>
${l.hasV?`<div class="vid"><video controls playsinline controlsList="nodownload" preload="metadata" src="${f("v")}"></video></div>`:""}
${m?`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0" allowfullscreen loading="lazy" title="${esc(l.title)}"></iframe></div>`:http(l.video)&&!l.hasV?`<a class="btn p" href="${esc(l.video)}" target="_blank" rel="noopener">شاهد الفيديو</a>`:""}
${l.hasP?`<div class="row"><a class="btn" href="${f("p")}" target="_blank" rel="noopener">📄 ملزمة الدرس</a></div>`:http(l.pdf)?`<div class="row"><a class="btn" href="${esc(l.pdf)}" target="_blank" rel="noopener">📄 ملزمة الدرس</a></div>`:""}</div>
${(l.quiz||[]).length?`<div class="card"><h3>اختبار الدرس</h3>${l.quiz.map((x,i)=>`<div class="q" id="q${i}"><b>${i+1}. ${esc(x.q)}</b>${x.o.map((o,j)=>`<label class="o"><input type="radio" name="q${i}" value="${j}">${esc(o)}</label>`).join("")}</div>`).join("")}<div class="row"><button class="btn p" data-a="sub|${cid}|${lid}">تسليم الإجابات</button><b id="rs" class="ok"></b></div></div>`:""}`}
async function submit(cid,lid){const l=S.courses.find(x=>x.id==cid).lessons.find(x=>x.id==lid),a=l.quiz.map((_,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1});
if(a.includes(-1))return toast("أجب عن كل الأسئلة أولًا");try{const r=await api("quiz",{c:cid,l:lid,ans:a});sc[lid]={score:r.score,total:r.total,at:Date.now(),title:l.title};LS.s("ak_scores",sc);
l.quiz.forEach((_,i)=>$("#q"+i).classList.toggle("w",r.wrong.includes(i)));$("#rs").textContent=`نتيجتك ${r.score} من ${r.total}${r.wrong.length?" — الأسئلة الخاطئة بالأحمر":" 🌟"}`}catch(e){toast(e.message)}}
function results(){const R=Object.values(sc).sort((a,b)=>b.at-a.at);app.innerHTML=`<h2>نتائجي</h2>${R.length?`<div class="card">${R.map(r=>`<div class="ls" style="cursor:default"><span>${esc(r.title)}</span><b style="margin-inline-start:auto">${r.score}/${r.total}</b></div>`).join("")}</div><p class="muted">النتائج محفوظة على هذا الجهاز.</p>`:`<div class="card muted">لم تحل أي اختبار بعد.</div>`}`}
async function activate(id){const code=dig($("#cd").value);try{await api("redeem",{code});LS.s("ak_codes",[...new Set([...LS.g("ak_codes",[]),code])]);await load();toast("تم تفعيل الكورس ✓");course(id)}catch(e){toast(e.message)}}
async function copyNum(){const n=S.settings.pay;try{await navigator.clipboard.writeText(n);toast("تم نسخ الرقم")}catch(e){toast("انسخ الرقم يدويًا: "+n)}}
/* ===== المدير ===== */
const cur=()=>W.courses.find(c=>c.id==sel);
function loginView(){app.innerHTML=`<div class="card auth"><h2>دخول المدير</h2><label>كلمة السر</label><input id="pw" type="password" dir="ltr" autocomplete="current-password"><div class="row"><button class="btn p" data-a="login">دخول</button></div></div>`}
async function persist(msg){await api("save",{settings:W.settings,courses:W.courses});W=await api("admin");await load();aview();toast(msg||"تم الحفظ")}
async function adm(){try{W=await api("admin");if(!cur())sel=(W.courses[0]||{}).id||"";aview()}catch(e){toast(e.message);loginView()}}
const v=id=>$("#"+id).value,selc=()=>`<div class="card"><div class="row"><select id="sc" style="flex:1">${W.courses.map(x=>`<option value="${x.id}" ${x.id==sel?"selected":""}>${esc(x.title)}</option>`).join("")}</select>${tab=="c"?`<button class="btn p" data-a="nc">+ كورس جديد</button>`:""}</div></div>`;
const q2t=q=>(q||[]).map(x=>[x.q,...x.o,x.a+1].join(" | ")).join("\n");
function t2q(t){const items=[],err=[];String(t||"").split("\n").forEach((s,i)=>{s=s.trim();if(!s)return;const p=s.split("|").map(x=>x.trim()),o=p.slice(1,-1),n=parseInt(dig(p[p.length-1]));if(p.length<4||o.some(x=>!x)||!(n>=1&&n<=o.length)){err.push(i+1);return}items.push({q:p[0],o,a:n-1})});return{items,err}}
function aview(){const c=cur(),T=[["c","الكورسات والدروس"],["k","أكواد التفعيل"],["s","الإعدادات"],["p","كلمة السر"]];let h=`${S.admin&&W.defpw?`<div class="warn">⚠️ ما زالت كلمة السر الافتراضية ABCDEFG. غيّرها الآن من تبويب «كلمة السر».</div>`:""}<div class="tabs">${T.map(([k,n])=>`<button class="btn ${k==tab?"p":""}" data-a="t|${k}">${n}</button>`).join("")}</div>`;
if(tab=="c"){const l=ed!=null?c.lessons[ed]:{};h+=selc()+(c?`<div class="card"><h3>بيانات الكورس</h3><label>العنوان</label><input id="ct" value="${esc(c.title)}"><label>المرحلة</label><select id="cg">${GR.map(g=>`<option ${g==c.grade?"selected":""}>${g}</option>`).join("")}</select><label>السعر (جنيه)</label><input id="cp" type="number" value="${c.price}"><label>الوصف</label><textarea id="cd" rows="2">${esc(c.desc)}</textarea><div class="row"><button class="btn p" data-a="saveC">حفظ</button><button class="btn d" data-a="delC">حذف الكورس</button></div></div>
<div class="card"><h3>${ed!=null?"تعديل درس":"درس جديد"}</h3><label>عنوان الدرس</label><input id="lt" value="${esc(l.title)}"><label>الوحدة</label><input id="lu" value="${esc(l.unit)}">
<label>فيديو من الهاتف أو الجهاز</label><input type="file" id="lvf" accept="video/*">${l.vfile?`<div class="muted">✓ مرفوع: ${esc(l.vname)} <label><input type="checkbox" id="lrv">إزالة</label></div>`:""}
<label>أو رابط فيديو (يوتيوب)</label><input id="lv" dir="ltr" value="${esc(l.video)}"><label>ملزمة PDF من الجهاز</label><input type="file" id="lpf" accept="application/pdf">${l.pfile?`<div class="muted">✓ مرفوعة: ${esc(l.pname)} <label><input type="checkbox" id="lrp">إزالة</label></div>`:""}
<label><input type="checkbox" id="lf" ${l.free?"checked":""}>درس مجاني (يراه الجميع بلا كود)</label><br><label>الأسئلة: سطر لكل سؤال: السؤال | خيار | خيار | خيار | رقم الصحيح</label><textarea id="lq" rows="4">${esc(q2t(l.quiz))}</textarea>
<div class="prog" id="pg" hidden><i id="pgi"></i></div><div class="muted" id="pgt"></div><div class="row"><button class="btn p" data-a="saveL">نشر الدرس</button>${ed!=null?`<button class="btn" data-a="canL">إلغاء</button>`:""}</div></div>
${c.lessons.map((x,i)=>`<div class="card"><b>${esc(x.title)}</b> <span class="muted">${esc(x.unit||"")}${x.free?" · مجاني":""}${x.vfile?" · 🎬":""}${x.pfile?" · 📄":""}</span><div class="row"><button class="btn" data-a="mv|${i}|-1">↑</button><button class="btn" data-a="mv|${i}|1">↓</button><button class="btn" data-a="edL|${i}">تعديل</button><button class="btn d" data-a="delL|${i}">حذف</button></div></div>`).join("")}`:`<div class="card muted">أنشئ كورسًا أولًا.</div>`)}
if(tab=="k")h+=selc()+(c?`<div class="card"><h3>إنشاء أكواد</h3><label>اسم الطالب أو ملاحظة</label><input id="kl"><label>العدد</label><input id="kn" type="number" value="1" min="1" max="50"><button class="btn p" data-a="gen">إنشاء</button></div>${(c.codes||[]).map((k,i)=>`<div class="card"><span class="cd">${k.code.slice(0,5)}-${k.code.slice(5)}</span> <span class="muted">${esc(k.label)} · استُخدم ${k.uses||0} مرة</span><div class="row"><button class="btn" data-a="cpk|${i}">نسخ رسالة للطالب</button><button class="btn d" data-a="rmk|${i}">حذف (يلغي الوصول)</button></div></div>`).join("")}`:`<div class="card muted">أنشئ كورسًا أولًا.</div>`);
if(tab=="s"){const t=W.settings,g=t.legal;h+=`<div class="card"><label>اسم المنصة</label><input id="sn" value="${esc(t.name)}"><label>جملة تعريفية</label><input id="st" value="${esc(t.tag)}"><label>رقم التحويل</label><input id="sp" dir="ltr" value="${esc(t.pay)}"><label>واتساب (بالصيغة الدولية 20...)</label><input id="sw" dir="ltr" value="${esc(t.wa)}"><label>شروط الاستخدام</label><textarea id="s1" rows="3">${esc(g.terms)}</textarea><label>الخصوصية</label><textarea id="s2" rows="3">${esc(g.privacy)}</textarea><label>الاسترجاع</label><textarea id="s3" rows="3">${esc(g.refund)}</textarea><button class="btn p" data-a="saveS">حفظ</button></div>`}
if(tab=="p")h+=`<div class="card"><h3>تغيير كلمة السر</h3><label>الحالية</label><input id="po" type="password" dir="ltr"><label>الجديدة (6 أحرف على الأقل، الأفضل أطول)</label><input id="pn" type="password" dir="ltr"><button class="btn p" data-a="savePw">تغيير</button></div>`;
app.innerHTML=h;if($("#sc"))$("#sc").onchange=e=>{sel=e.target.value;ed=null;aview()}}
async function up(f,label){const ext=(f.name.split(".").pop()||"").toLowerCase(),id=hex(12),CH=1048576,n=Math.max(1,Math.ceil(f.size/CH));let last;$("#pg").hidden=false;
for(let i=0;i<n;i++){let ok=0;for(let t=0;t<3&&!ok;t++){try{last=await fetch(`api.php?a=up&id=${id}&i=${i}&n=${n}&ext=${ext}`,{method:"POST",headers:{"X-Req":"1","Content-Type":"application/octet-stream"},body:f.slice(i*CH,(i+1)*CH)});if(!last.ok)throw new Error((await last.json()).e||"فشل الرفع");ok=1}catch(e){if(t==2)throw e;await new Promise(r=>setTimeout(r,1500))}}
$("#pgi").style.width=(100*(i+1)/n)+"%";$("#pgt").textContent=`جارٍ رفع ${label}… ${Math.round(100*(i+1)/n)}%`}
const j=await last.json();$("#pg").hidden=true;$("#pgt").textContent="";return j.file}
const AH={
async enter(){try{await api("login",{password:v("pw")});await load();await adm()}catch(e){toast(e.message)}},
t:x=>{tab=x;ed=null;aview()},
nc:async()=>{const c={id:rid(6),title:"كورس جديد",grade:GR[0],price:100,desc:"",lessons:[],codes:[]};W.courses.push(c);sel=c.id;await persist("تم إنشاء الكورس")},
saveC:async()=>{Object.assign(cur(),{title:v("ct"),grade:v("cg"),price:+v("cp")||0,desc:v("cd")});await persist()},
delC:async()=>{if(await ask("حذف الكورس بكل دروسه وأكواده؟")){W.courses=W.courses.filter(c=>c.id!=sel);sel="";ed=null;await persist("تم الحذف")}},
async saveL(b){const c=cur(),q=t2q(v("lq"));if(!v("lt").trim())return toast("اكتب عنوان الدرس");if(q.err.length)return toast("خطأ في الأسئلة، السطور: "+q.err.join("، "));
const old=ed!=null?c.lessons[ed]:{},l={vfile:"",vname:"",pfile:"",pname:"",...old,id:old.id||rid(6),title:v("lt").trim(),unit:v("lu").trim(),video:v("lv").trim(),pdf:"",free:$("#lf").checked,quiz:q.items},fv=$("#lvf").files[0],fp=$("#lpf").files[0];
l.pdf=old.pdf||"";if($("#lrv")&&$("#lrv").checked){l.vfile="";l.vname=""}if($("#lrp")&&$("#lrp").checked){l.pfile="";l.pname=""}
b.disabled=true;try{if(fv){if(!/\.(mp4|webm|mov|m4v)$/i.test(fv.name))throw new Error("صيغة الفيديو غير مدعومة. استخدم MP4");l.vfile=await up(fv,"الفيديو");l.vname=fv.name}
if(fp){if(!/\.pdf$/i.test(fp.name))throw new Error("الملزمة يجب أن تكون PDF");l.pfile=await up(fp,"الملزمة");l.pname=fp.name}
ed!=null?c.lessons[ed]=l:c.lessons.push(l);ed=null;await persist("تم نشر الدرس ✓ ويظهر للطلاب الآن")}catch(e){toast(e.message);b.disabled=false}},
canL:()=>{ed=null;aview()},edL:i=>{ed=+i;aview();scrollTo(0,300)},
delL:async i=>{if(await ask("حذف الدرس؟")){cur().lessons.splice(+i,1);await persist("تم الحذف")}},
mv:async(i,d)=>{const L=cur().lessons,j=+i+ +d;if(!L[j])return;[L[i],L[j]]=[L[j],L[i]];await persist()},
gen:async()=>{const c=cur(),n=Math.min(50,+v("kn")||1),b=v("kl").trim();c.codes=c.codes||[];for(let i=0;i<n;i++)c.codes.push({code:rid(10),label:n>1?`${b} ${i+1}`.trim():b,at:Math.floor(Date.now()/1000),uses:0});await persist("تم إنشاء الأكواد")},
cpk:async i=>{const c=cur(),k=c.codes[+i],m=`كود تفعيل كورس «${c.title}»:\n${k.code.slice(0,5)}-${k.code.slice(5)}\nاكتبه في خانة التفعيل داخل صفحة الكورس.`;try{await navigator.clipboard.writeText(m);toast("تم النسخ")}catch(e){toast(m)}},
rmk:async i=>{if(await ask("حذف الكود؟ سيفقد صاحبه الوصول فورًا")){cur().codes.splice(+i,1);await persist("تم حذف الكود")}},
saveS:async()=>{Object.assign(W.settings,{name:v("sn"),tag:v("st"),pay:v("sp"),wa:v("sw"),legal:{terms:v("s1"),privacy:v("s2"),refund:v("s3")}});await persist()},
savePw:async()=>{try{await api("pw",{old:v("po"),new:v("pn")});W=await api("admin");aview();toast("تم تغيير كلمة السر ✓")}catch(e){toast(e.message)}}};
const ask=m=>new Promise(r=>{const d=$("#modal");d.innerHTML=`<div class="card"><p>${esc(m)}</p><div class="row"><button class="btn d" id="ay">تأكيد</button><button class="btn" id="an">إلغاء</button></div></div>`;d.hidden=false;$("#ay").onclick=()=>{d.hidden=true;r(true)};$("#an").onclick=()=>{d.hidden=true;r(false)}});
const H={g:x=>{grade=x;home()},c:x=>course(x),l:(x,y)=>lesson(x,y),h:home,r:results,cp:copyNum,act:x=>activate(x),sub:(x,y)=>submit(x,y),
adm:()=>adm(),lo:async()=>{await api("logout",{});W=null;await load();home()},login:AH.enter};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const[a,x,y]=b.dataset.a.split("|");if(["g","c","l","h","r","adm","lo","t"].includes(a))scrollTo(0,0);
if(H[a])H[a](x,y);else if(a=="saveL")AH.saveL(b);else if(AH[a])AH[a](x,y)});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&$("#pw"))AH.enter()});
document.querySelectorAll("[data-leg]").forEach(a=>a.onclick=()=>{const m=$("#modal");m.innerHTML=`<div class="card"><h3>${a.textContent}</h3><p>${esc(((S.settings||{}).legal||{})[a.dataset.leg]||"")}</p><button class="btn p" id="mc">إغلاق</button></div>`;m.hidden=false;$("#mc").onclick=()=>m.hidden=true});
$("#adl").onclick=()=>{S.admin?adm():loginView()};
(async()=>{try{for(const k of LS.g("ak_codes",[]))await api("redeem",{code:k}).catch(()=>{});await load();home()}catch(e){app.innerHTML=`<div class="card"><h3>تعذّر تشغيل الموقع</h3><p>${esc(e.message)}</p></div>`}})();

</script>
</body>
</html>
