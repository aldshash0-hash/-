<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أداة المدير – العكريشي</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--text:#16192b;--muted:#586079;--pri:#2b3a8c;--onpri:#fff;--acc:#e8590c;--line:#dbe0ee;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--text:#eceefa;--muted:#a3a9c4;--pri:#8e9bff;--onpri:#10142c;--acc:#ff8a4c;--line:#2a2f4a;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.8}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.bar{max-width:900px;margin:auto;padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.bar b{color:var(--pri);margin-inline-end:auto}
main{max-width:900px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}h3{margin:0 0 6px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:10px;cursor:pointer}.btn.p,.btn.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.btn.d{color:var(--bad);border-color:var(--bad)}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 0 8px}input[type=checkbox]{width:auto;margin:0 0 0 8px}
label{font-size:.9rem;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.muted{color:var(--muted);font-size:.9rem}
.cd{direction:ltr;font-weight:700;letter-spacing:1px;color:var(--acc)}#toast{position:fixed;bottom:20px;inset-inline:16px;margin:auto;max-width:420px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;text-align:center}[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="bar"><b>🛠 أداة المدير – العكريشي</b><span id="tabs"></span></div></header>
<main id="app"></main><div id="toast" hidden></div>
<script>
/*C*/
const enc=new TextEncoder();
const b64=u=>{let s="";new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const kdf=async(sec,salt)=>crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},await crypto.subtle.importKey("raw",enc.encode(sec),"PBKDF2",false,["deriveKey"]),{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
const seal=async(k,b)=>{const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,b))}};
const AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>AL[x%32]).join("");
function parseQ(t){const items=[],err=[];String(t||"").split("\n").forEach((s,i)=>{s=s.trim();if(!s)return;const p=s.split("|").map(x=>x.trim()),o=p.slice(1,-1),n=parseInt(p[p.length-1]);if(p.length<4||o.some(x=>!x)||!(n>=1&&n<=o.length)){err.push(i+1);return}items.push({q:p[0],o,a:n-1})});return{items,err}}
async function build(S){const out={settings:S.settings,courses:[]};
for(const c of S.courses){const L=c.lessons.map((l,i)=>({id:l.id,title:l.title,unit:l.unit||"",video:l.video||"",pdf:l.pdf||"",quiz:parseQ(l.quiz).items,n:i}));
const free=[],lk=[];c.lessons.forEach((l,i)=>(l.free?free:lk).push(L[i]));
const o={id:c.id,title:c.title,grade:c.grade,price:c.price,desc:c.desc,free,outline:lk.map(l=>({id:l.id,t:l.title,u:l.unit,n:l.n})),locked:null,wraps:[]};
if(lk.length){const ck=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);o.locked=await seal(ck,enc.encode(JSON.stringify(lk)));const raw=new Uint8Array(await crypto.subtle.exportKey("raw",ck));
for(const k of c.codes||[]){const salt=crypto.getRandomValues(new Uint8Array(16));o.wraps.push({id:k.id,salt:b64(salt),...await seal(await kdf(k.secret,salt),raw)})}}
out.courses.push(o)}return out}
/*E*/
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const GR=["الأول الإعدادي","الثاني الإعدادي","الثالث الإعدادي","الأول الثانوي","الثاني الثانوي","الثالث الثانوي"];
let S=LS.g("ak_admin",null)||{settings:{name:"العكريشي",tag:"دروس اللغة العربية لكل مرحلة دراسية",pay:"01151045032",wa:"201151045032",legal:{terms:"",privacy:"",refund:""}},courses:[]},tab="c",sel="",ed=null;
const sv=()=>LS.s("ak_admin",S),cur=()=>S.courses.find(c=>c.id==sel)||(sel=(S.courses[0]||{}).id,S.courses[0]);
const toast=t=>{const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,5000)};
const v=id=>$("#"+id).value,sel_=()=>`<div class="card"><div class="row"><select id="sc" style="flex:1">${S.courses.map(x=>`<option value="${x.id}" ${x.id==cur()?.id?"selected":""}>${esc(x.title)}</option>`).join("")}</select>${tab=="c"?`<button class="btn p" data-a="nc">+ كورس جديد</button>`:""}</div></div>`;
function render(){$("#tabs").innerHTML=[["c","الكورسات والدروس"],["k","أكواد التفعيل"],["s","الإعدادات"],["p","النشر"]].map(([k,n])=>`<button class="btn ${k==tab?"on":""}" data-a="t|${k}">${n}</button>`).join("");
const c=cur();let h="";
if(tab=="c"){const l=ed!=null?c.lessons[ed]:{};h=sel_()+(c?`<div class="card"><h3>بيانات الكورس</h3><label>العنوان</label><input id="ct" value="${esc(c.title)}"><label>المرحلة</label><select id="cg">${GR.map(g=>`<option ${g==c.grade?"selected":""}>${g}</option>`).join("")}</select><label>السعر (جنيه)</label><input id="cp" type="number" value="${c.price}"><label>الوصف</label><textarea id="cd" rows="2">${esc(c.desc)}</textarea><div class="row"><button class="btn p" data-a="saveC">حفظ</button><button class="btn d" data-a="delC">حذف الكورس</button></div></div>
<div class="card"><h3>${ed!=null?"تعديل درس":"درس جديد"}</h3><label>عنوان الدرس</label><input id="lt" value="${esc(l.title)}"><label>الوحدة</label><input id="lu" value="${esc(l.unit)}"><label>رابط الفيديو (يوتيوب «غير مدرج»)</label><input id="lv" dir="ltr" value="${esc(l.video)}"><label>رابط الملزمة PDF</label><input id="lp" dir="ltr" value="${esc(l.pdf)}">
<label><input type="checkbox" id="lf" ${l.free?"checked":""}>درس مجاني (يراه الجميع بلا كود)</label><br><label>الأسئلة: سطر لكل سؤال: السؤال | خيار | خيار | خيار | رقم الصحيح</label><textarea id="lq" rows="4">${esc(l.quiz)}</textarea><div class="row"><button class="btn p" data-a="saveL">حفظ الدرس</button>${ed!=null?`<button class="btn" data-a="canL">إلغاء</button>`:""}</div></div>
${c.lessons.map((x,i)=>`<div class="card"><b>${esc(x.title)}</b> <span class="muted">${esc(x.unit||"")}${x.free?" · مجاني":""}</span><div class="row"><button class="btn" data-a="mv|${i}|-1">↑</button><button class="btn" data-a="mv|${i}|1">↓</button><button class="btn" data-a="edL|${i}">تعديل</button><button class="btn d" data-a="delL|${i}">حذف</button></div></div>`).join("")}`:`<div class="card muted">أنشئ كورسًا أولًا.</div>`)}
if(tab=="k")h=sel_()+(c?`<div class="card"><h3>إنشاء أكواد</h3><label>اسم الطالب أو ملاحظة</label><input id="kl"><label>العدد</label><input id="kn" type="number" value="1" min="1" max="50"><button class="btn p" data-a="gen">إنشاء</button></div>${(c.codes||[]).map((k,i)=>`<div class="card"><span class="cd">${k.id}-${k.secret}</span> <span class="muted">${esc(k.label)}</span><div class="row"><button class="btn" data-a="cpk|${i}">نسخ رسالة للطالب</button><button class="btn d" data-a="rmk|${i}">حذف</button></div></div>`).join("")}<p class="muted">بعد إضافة أو حذف أي كود ادخل «النشر» ونزّل data.js جديدًا وارفعه.</p>`:`<div class="card muted">أنشئ كورسًا أولًا.</div>`);
if(tab=="s"){const t=S.settings,g=t.legal;h=`<div class="card"><label>اسم المنصة</label><input id="sn" value="${esc(t.name)}"><label>جملة تعريفية</label><input id="st" value="${esc(t.tag)}"><label>رقم التحويل</label><input id="sp" dir="ltr" value="${esc(t.pay)}"><label>واتساب (بالصيغة الدولية 20...)</label><input id="sw" dir="ltr" value="${esc(t.wa)}"><label>شروط الاستخدام</label><textarea id="s1" rows="3">${esc(g.terms)}</textarea><label>الخصوصية</label><textarea id="s2" rows="3">${esc(g.privacy)}</textarea><label>الاسترجاع</label><textarea id="s3" rows="3">${esc(g.refund)}</textarea><button class="btn p" data-a="saveS">حفظ</button></div>`}
if(tab=="p")h=`<div class="card"><h3>نشر التعديلات</h3><p>1) نزّل <b>data.js</b> وارفعه بدل القديم في موقعك (GitHub).<br>2) نزّل <b>source.json</b> واحتفظ به عندك فقط، ولا ترفعه أبدًا؛ فيه نص الدروس المدفوعة وأكواد الطلاب.</p><div class="row"><button class="btn p" data-a="dlJS">تنزيل data.js</button><button class="btn" data-a="dlSrc">تنزيل source.json</button></div><textarea id="out" rows="3" dir="ltr" readonly hidden></textarea><h3 style="margin-top:14px">استرجاع نسخة</h3><input type="file" id="im" accept=".json"></div>`;
$("#app").innerHTML=h;if($("#sc"))$("#sc").onchange=e=>{sel=e.target.value;ed=null;render()};if($("#im"))$("#im").onchange=imp}
const PH="e9a92a2ed0d53732ac13b031a27b071814231c8633c9f41844ccba884d482b16",sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function login(){$("#tabs").innerHTML="";$("#app").innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h3>دخول المدير</h3><label>كلمة السر</label><input id="pw" type="password" dir="ltr" autocomplete="off"><div class="row"><button class="btn p" data-a="enter">دخول</button><a class="btn" href="index.html">الموقع</a></div></div>`}
const ask=m=>new Promise(r=>{const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20";d.innerHTML=`<div class="card" style="max-width:380px;margin:0"><p>${esc(m)}</p><div class="row"><button class="btn d" id="ay">تأكيد</button><button class="btn" id="an">إلغاء</button></div></div>`;document.body.appendChild(d);d.querySelector("#ay").onclick=()=>{d.remove();r(true)};d.querySelector("#an").onclick=()=>{d.remove();r(false)}});
const dl=(n,t)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain;charset=utf-8"}));a.download=n;a.click()};
async function imp(e){try{S=JSON.parse(await e.target.files[0].text());sv();sel="";render();toast("تم الاسترجاع")}catch(x){toast("الملف غير صالح")}}
const H={enter:async()=>{if(await sha(v("pw").replace(/\s/g,"").toUpperCase())===PH){try{sessionStorage.setItem("ak_in","1")}catch(e){}render()}else toast("كلمة السر غير صحيحة")},t:x=>{tab=x;ed=null;render()},
nc:()=>{const c={id:rid(6),title:"كورس جديد",grade:GR[0],price:100,desc:"",lessons:[],codes:[]};S.courses.push(c);sel=c.id;sv();render()},
saveC:()=>{const c=cur();Object.assign(c,{title:v("ct"),grade:v("cg"),price:+v("cp")||0,desc:v("cd")});sv();render();toast("تم الحفظ")},
delC:async()=>{if(await ask("حذف الكورس بكل دروسه وأكواده؟")){S.courses=S.courses.filter(c=>c.id!=sel);sel="";ed=null;sv();render()}},
saveL:()=>{const c=cur(),q=parseQ(v("lq"));if(!v("lt").trim())return toast("اكتب عنوان الدرس");if(q.err.length)return toast("خطأ في الأسئلة، السطور: "+q.err.join("، "));
const l={id:ed!=null?c.lessons[ed].id:rid(6),title:v("lt").trim(),unit:v("lu").trim(),video:v("lv").trim(),pdf:v("lp").trim(),free:$("#lf").checked,quiz:v("lq")};ed!=null?c.lessons[ed]=l:c.lessons.push(l);ed=null;sv();render();toast("تم حفظ الدرس")},
canL:()=>{ed=null;render()},edL:i=>{ed=+i;render();scrollTo(0,200)},
delL:async i=>{if(await ask("حذف الدرس؟")){cur().lessons.splice(+i,1);sv();render()}},
mv:(i,d)=>{const L=cur().lessons,j=+i+ +d;if(!L[j])return;[L[i],L[j]]=[L[j],L[i]];sv();render()},
gen:()=>{const c=cur(),n=Math.min(50,+v("kn")||1),b=v("kl").trim();c.codes=c.codes||[];for(let i=0;i<n;i++){let id;do id=rid(4);while(c.codes.some(k=>k.id==id));c.codes.push({id,secret:rid(8),label:n>1?`${b} ${i+1}`.trim():b,at:Date.now()})}sv();render()},
cpk:async i=>{const c=cur(),k=c.codes[+i],m=`كود تفعيل كورس «${c.title}»:\n${k.id}-${k.secret}\nاكتبه في خانة التفعيل داخل صفحة الكورس.`;try{await navigator.clipboard.writeText(m);toast("تم النسخ")}catch(e){toast(m)}},
rmk:i=>{cur().codes.splice(+i,1);sv();render()},
saveS:()=>{Object.assign(S.settings,{name:v("sn"),tag:v("st"),pay:v("sp"),wa:v("sw"),legal:{terms:v("s1"),privacy:v("s2"),refund:v("s3")}});sv();toast("تم الحفظ")},
dlJS:async()=>{const bad=S.courses.flatMap(c=>c.lessons.filter(l=>parseQ(l.quiz).err.length));if(bad.length)return toast("في درس «"+bad[0].title+"» أسئلة بصيغة خاطئة");toast("جارٍ التشفير… قد يستغرق ثوانٍ");const t="window.AK="+JSON.stringify(await build(S))+";";dl("data.js",t);$("#out").value=t;$("#out").hidden=false;toast("نُزّل data.js. إن لم يُنزَّل انسخ النص أسفل الأزرار وضعه في ملف باسم data.js")},
dlSrc:()=>dl("source.json",JSON.stringify(S))};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const[a,...x]=b.dataset.a.split("|");H[a](...x)});
let okIn=false;try{okIn=sessionStorage.getItem("ak_in")=="1"}catch(e){}okIn?render():login();
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&$("#pw"))H.enter()});
</script>
</body>
</html>
